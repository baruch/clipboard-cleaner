name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Check formatting
      run: cargo fmt -- --check

    - name: Run clippy
      run: cargo clippy -- -D warnings

    - name: Run tests
      run: cargo test

    - name: Build
      run: cargo build --release

    - name: Check file endings
      run: |
        # Check that all source files end with newlines
        find . -name "*.rs" -o -name "*.toml" -o -name "*.md" -o -name ".gitignore" | grep -v target | while read file; do
          if [ "$(tail -c1 "$file" | wc -c)" -eq 0 ]; then
            echo "ERROR: $file does not end with a newline"
            exit 1
          fi
        done